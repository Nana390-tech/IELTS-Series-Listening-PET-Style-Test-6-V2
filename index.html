<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PET Listening Practice Test 6</title>
<style>
:root{
  --berry:#9b1d5a; --berry-d:#6e1240; --berry-l:#f8e6ef;
  --sage:#4f8a68; --sage-l:#e4f1e9;
  --gold:#e0a526; --ink:#2a2230; --muted:#6b6070; --bg:#fbf7f4; --card:#ffffff;
  --line:#eadde3; --bad:#c43c3c; --bad-l:#fbe7e7;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:19px;line-height:1.55}
header{background:linear-gradient(135deg,var(--berry-d),var(--berry));color:#fff;padding:22px 16px 18px;text-align:center}
header h1{margin:0;font-size:1.7em;letter-spacing:.3px}
header p{margin:6px 0 0;opacity:.9}
.wrap{max-width:960px;margin:0 auto;padding:16px}
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.name{flex:1;min-width:220px;display:flex;gap:8px;align-items:center}
.name input{flex:1;font-size:1em;padding:9px 12px;border:2px solid var(--line);border-radius:10px}
.btn{border:none;border-radius:10px;padding:10px 16px;font-size:.95em;font-weight:600;cursor:pointer;background:var(--berry);color:#fff}
.btn:hover{background:var(--berry-d)}
.btn.alt{background:var(--sage)} .btn.alt:hover{background:#3c6d51}
.btn.ghost{background:#fff;color:var(--berry);border:2px solid var(--berry)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{flex:1;min-width:130px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px;text-align:center;cursor:pointer;font-weight:600;color:var(--muted)}
.tab small{display:block;font-weight:400;font-size:.78em}
.tab.on{border-color:var(--berry);color:var(--berry);background:var(--berry-l)}
.tab.done::after{content:" ✓";color:var(--sage)}
.card{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 2px 10px rgba(80,20,50,.07);margin-bottom:16px}
.part-head h2{margin:0 0 4px;color:var(--berry)}
.instr{background:var(--sage-l);border-left:5px solid var(--sage);padding:10px 14px;border-radius:8px;margin:10px 0}
.ar{direction:rtl;font-family:Tahoma,Arial,sans-serif;color:var(--sage);font-size:.92em;display:block;margin-top:4px}
.player{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--berry-l);border-radius:12px;padding:12px;margin:12px 0}
.player audio{flex:1;min-width:240px}
.plays{font-size:.85em;color:var(--berry-d);font-weight:600}
.missing{background:#fff6e0;border:2px dashed var(--gold);padding:12px;border-radius:10px;font-size:.92em}
.tip{background:#fff;border:2px solid var(--gold);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:.92em}
.tip b{color:#a36f00}
.q{border-top:1px solid var(--line);padding:16px 0}
.q:first-of-type{border-top:none}
.qn{display:inline-block;background:var(--berry);color:#fff;border-radius:8px;padding:1px 9px;margin-right:8px;font-weight:700}
.ctx{color:var(--muted);font-style:italic;margin:4px 0 6px}
.pic{width:100%;max-width:760px;display:block;margin:10px auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.opts.row{flex-direction:row;justify-content:center;gap:14px}
.opt{border:2px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;text-align:left;font-size:1em;cursor:pointer;color:var(--ink)}
.opts.row .opt{min-width:80px;text-align:center;font-weight:700;font-size:1.15em}
.opt:hover{border-color:var(--berry)}
.opt.sel{border-color:var(--berry);background:var(--berry-l)}
.opt.right{border-color:var(--sage);background:var(--sage-l)}
.opt.wrong{border-color:var(--bad);background:var(--bad-l)}
.opt b{color:var(--berry);margin-right:8px}
table.form{width:100%;border-collapse:collapse;margin-top:10px}
table.form td{border:1px solid var(--line);padding:10px;vertical-align:middle}
table.form td:first-child{width:45%;font-weight:600;background:#fdf9fb}
table.form caption{font-weight:700;font-size:1.1em;padding:8px;color:var(--berry)}
.gap{font-size:1em;padding:7px 10px;border:2px solid var(--line);border-radius:8px;width:200px;max-width:100%}
.gap.right{border-color:var(--sage);background:var(--sage-l)}
.gap.wrong{border-color:var(--bad);background:var(--bad-l)}
.fb{margin-top:8px;padding:8px 12px;border-radius:8px;font-size:.9em;display:none}
.fb.show{display:block}
.fb.ok{background:var(--sage-l)} .fb.no{background:var(--bad-l)}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px}
.score-pill{display:inline-block;background:var(--sage);color:#fff;border-radius:20px;padding:4px 14px;font-weight:700}
.summary table{width:100%;border-collapse:collapse}
.summary td,.summary th{padding:10px;border-bottom:1px solid var(--line);text-align:left}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;min-width:100px}
.bar i{display:block;height:100%;background:var(--sage)}
.big{font-size:2.4em;font-weight:800;color:var(--berry);text-align:center;margin:6px 0}
#cert{display:none}
.certbox{border:8px double var(--gold);border-radius:16px;padding:30px 20px;text-align:center;background:linear-gradient(#fff,#fdf4f8)}
.certbox h2{color:var(--berry);font-size:2em;margin:0}
.certbox .who{font-size:1.8em;font-weight:700;margin:14px 0;color:var(--ink);border-bottom:2px solid var(--gold);display:inline-block;padding:0 20px}
footer{text-align:center;color:var(--muted);font-size:.85em;padding:20px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:99}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:100}
@media print{header,.topbar,.tabs,#main,footer,.noprint{display:none!important}#cert{display:block!important}}
@media (max-width:600px){body{font-size:17px}.opts.row{gap:8px}.opts.row .opt{min-width:60px}}
</style>
</head>
<body>
<header>
  <h1>🎧 PET Listening Practice Test 6</h1>
  <p>B1 Preliminary · 4 parts · 25 questions</p>
</header>

<div class="wrap">
  <div class="topbar">
    <div class="name"><label for="sname"><b>Name:</b></label><input id="sname" placeholder="Write your name"></div>
    <button class="btn alt" onclick="saveWork()">💾 Save my work</button>
    <button class="btn ghost" onclick="document.getElementById('loadf').click()">📂 Open saved work</button>
    <input type="file" id="loadf" accept=".json" hidden onchange="loadWork(event)">
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="main"></div>
</div>

<div id="cert" class="wrap">
  <div class="certbox">
    <div style="font-size:3em">🏆</div>
    <h2>Certificate of Achievement</h2>
    <p>This certifies that</p>
    <div class="who" id="certName">Student</div>
    <p>completed <b>PET Listening Practice Test 6</b> with a score of</p>
    <div class="big" id="certScore">0/25</div>
    <p id="certDate"></p>
    <p style="margin-top:24px;color:var(--muted)">Designed by: Nazila Motahari</p>
  </div>
  <div class="actions noprint"><button class="btn" onclick="window.print()">🖨️ Print / Save as PDF</button><button class="btn ghost" onclick="hideCert()">Close</button></div>
</div>

<footer>Designed by: Nazila Motahari</footer>
<canvas id="confetti"></canvas>
<div class="toast" id="toast"></div>

const PARTS = [
 {id:1, title:"Part 1", sub:"Questions 1–7", audio:"part1.mp3",
  instr:"For each question, choose the correct picture.",
  ar:"لكل سؤال، اختر الصورة الصحيحة.",
  tip:"<b>Tip:</b> Before you listen, look at the three pictures and say what each one is. You will often hear <i>all three</i> things mentioned — listen for the one the speaker <b>chooses</b> or <b>changes to</b> (\"Actually…\", \"In that case…\").",
  qs:[
   {n:1,type:"pic",q:"What is the girl going to bring for the picnic?",a:"A",ex:"The girl first thinks about fruit, but the boy says Harry is bringing fruit. She says, \"In that case, I'll go with my other idea. We've got plenty of bread and cheese\" — so she will make <b>sandwiches</b>."},
   {n:2,type:"pic",q:"Which activity did the boy enjoy most during his holiday?",a:"C",ex:"He did some windsurfing on a lake: \"It's <b>still my favourite</b>.\" Cycling was only \"<i>nearly</i> as exciting\", and he didn't go horse-riding — \"we just ran out of time\"."},
   {n:3,type:"pic",q:"What homework does the girl have to do tonight?",a:"C",ex:"Art (the vase) can wait until Wednesday, and maths until the weekend. \"My <b>history essay</b> has to be in tomorrow, so I'd better finish that <b>this evening</b>.\""},
   {n:4,type:"pic",q:"Where did the students go on their school trip?",a:"B",ex:"The dinosaur bones were <i>last year's</i> trip (\"At least this time they were <b>alive</b>\"), and the teacher <i>didn't</i> go to the farm. Live animals from all over the world = the <b>zoo</b>."},
   {n:5,type:"pic",q:"Which present has the boy already bought?",a:"C",ex:"\"I saw some boxes of the ones he really likes on special offer… so I <b>just got one</b>\" — the chocolates. The cookery book is for Sarah to buy, and socks are what they <i>usually</i> get."},
   {n:6,type:"pic",q:"Where did the boy go with his family at the weekend?",a:"A",ex:"His sister wanted the funfair and his parents wanted the river. Then it rained, \"so I got what I wanted in the end because the <b>roof closes</b> when it rains\" — the football match at the <b>stadium</b>."},
   {n:7,type:"pic",q:"How will the girl get to her friend's house?",a:"B",ex:"Her bike has a problem with the tyre and it's too big for the bus. \"My dad… said he can <b>give me a ride</b>\" — so she will go by <b>car</b>."}
  ]},
 {id:2, title:"Part 2", sub:"Questions 8–13", audio:"part2.mp3",
  instr:"For each question, choose the correct answer.",
  ar:"لكل سؤال، اختر الإجابة الصحيحة.",
  tip:"<b>Tip:</b> Read the question line carefully — it tells you the <b>job</b>: a reason (<i>Why…?</i>), a feeling (<i>How did she feel?</i>), an agreement (<i>They agree that…</i>) or a purpose (<i>is trying to…</i>). For \"agree\" questions, both speakers must say yes to the same idea.",
  qs:[
   {n:8,type:"mc",ctx:"You will hear two friends talking about a film they've just seen.",q:"Why didn't the boy enjoy the film?",o:["It was very frightening.","It lasted too long.","It had terrible acting."],a:"C",ex:"He usually likes horror films, and \"there was only one bit I found at all scary\" — so it wasn't too frightening. The two big stars were the problem: \"I don't know how they got to be so famous if <b>that's the best they can do</b>\" = terrible acting."},
   {n:9,type:"mc",ctx:"You will hear two friends talking about some biology homework.",q:"The girl suggests that the boy should",o:["ask his teacher for help.","get information from the internet.","look in the biology textbook."],a:"A",ex:"Looking online \"won't be much use\". \"Have you seen <b>Mr Benson</b> about it?… It might be best.\" The coursebook is only something to <i>take with him</i> to the teacher."},
   {n:10,type:"mc",ctx:"You will hear two friends talking about an interview with a singer they've seen on TV.",q:"They agree that",o:["the singer's answers were interesting.","the interviewer was quite rude.","the questions were confusing."],a:"A",ex:"The interviewer was <i>not</i> rude and didn't ask anything difficult. Both friends liked hearing him talk about \"lots of things I didn't know anything about… in so much detail\" — \"Exactly.\""},
   {n:11,type:"mc",ctx:"You will hear a girl telling her friend about a diving trip.",q:"How did the girl feel about it?",o:["sure she will go again","glad she went with a relative","pleased with her diving skills"],a:"B",ex:"She isn't sure about going again (\"I'll think about it\") and her skills were worse in the sea. \"I need to make sure I go with my <b>cousin</b> Martin again. It gave me a bit more confidence.\" (cousin = relative)"},
   {n:12,type:"mc",ctx:"You will hear a girl talking to a friend about basketball.",q:"The girl is trying to",o:["explain the rules of the game.","describe a game she took part in.","encourage the boy to start playing."],a:"C",ex:"She mentions the rules but doesn't explain them. \"The <b>best way</b> to understand them <b>is to play</b>. That way you'll learn them as you are having fun.\" The boy answers \"Maybe one day\" — she is encouraging him."},
   {n:13,type:"mc",ctx:"You will hear a boy talking about a trip to a city with his family.",q:"Why did the boy's family get lost?",o:["They couldn't understand their map.","Someone gave them the wrong directions.","The guidebook contained incorrect information."],a:"B",ex:"The old guidebook was \"probably <i>more</i> accurate than the information <b>a guy on the street gave us</b> for getting to Big Ben. We ended up somewhere completely different.\" The underground map was fine."}
  ]},
 {id:3, title:"Part 3", sub:"Questions 14–19", audio:"part3.mp3",
  instr:"For each question, write the correct answer in the gap. Write <b>one</b> or <b>two words</b> or a <b>number</b> or a <b>date</b> or a <b>time</b>.",
  ar:"اكتب الإجابة الصحيحة في الفراغ: كلمة أو كلمتان أو رقم أو تاريخ أو وقت.",
  tip:"<b>Tip:</b> Before you listen, predict the <b>type</b> of word for each gap: a place? a number? a name? For a website, the speaker will <b>spell</b> the name — write the letters down one by one.",
  ctx:"You will hear a student giving a review of a new video game to his class.",
  qs:[
   {n:14,type:"gap",label:"Action takes place in:",pre:"a",post:"",acc:["rainforest","rain forest","rainforests","rain forests"],a:"rainforest",ex:"\"Instead of streets and huge buildings, you'll find yourself living in a <b>rainforest</b> in this game.\""},
   {n:15,type:"gap",label:"Players answer questions about:",pre:"",post:"",acc:["insects","insects questions","about insects"],a:"insects",ex:"\"You'll be asked all sorts of things regarding <b>insects</b>.\" Butterflies and bats are the creatures who <i>help</i> you — they are not the topic of the questions."},
   {n:16,type:"gap",label:"Name of most difficult level of game:",pre:"the",post:"",acc:["monkey","monkey level","the monkey level"],a:"(the) monkey",ex:"\"I found the one called <b>the Monkey</b> almost impossible.\" The Frog is the <i>last</i> level, but he says it \"didn't seem so difficult\"."},
   {n:17,type:"gap",label:"Best thing about the game:",pre:"the",post:"",acc:["characters","game characters","playable characters","characters you can play","the characters you can play"],a:"characters",ex:"\"The story… is fantastic, <b>second only to</b> the <b>characters</b> you can play.\" <i>Second only to</i> means the characters are number one — the story is second."},
   {n:18,type:"gap",label:"Maximum number of players:",pre:"",post:"",acc:["6","six","6 people","six people","6 players","six players","6 people at the most","six people at the most","maximum 6","maximum six"],a:"six / 6",ex:"\"<b>Six</b> people at the most can join in this game at any one time.\" Eight was the number for the old game, Road Jam, and four is the number he <i>prefers</i> — both are distractors."},
   {n:19,type:"gap",label:"Website for more details:",pre:"www.",post:".com",acc:["lombardio","wwwlombardiocom","lombardiocom","wwwlombardio"],a:"LOMBARDIO",ex:"The speaker spells it: L-O-M-B-A-R-D-I-O."}
  ]},
 {id:4, title:"Part 4", sub:"Questions 20–25", audio:"part4.mp3",
  instr:"For each question, choose the correct answer.",
  ar:"لكل سؤال، اختر الإجابة الصحيحة.",
  tip:"<b>Tip:</b> The questions follow the order of the interview. Underline the key word in each question (<i>first</i>, <i>why</i>, <i>feel</i>, <i>favourite</i>, <i>should</i>) so you know when the answer is coming.",
  ctx:"You will hear an interview with a 15-year-old girl called Andrea, who plays ice hockey for her National Under-16s Team.",
  qs:[
   {n:20,type:"mc",q:"Which sport does Andrea say she started playing first?",o:["football","ice hockey","basketball"],a:"C",ex:"\"I've played <b>basketball</b> since I was five or six.\" She only got into football about five years ago, and ice hockey three years ago."},
   {n:21,type:"mc",q:"Andrea says that she first started playing ice hockey after",o:["watching a family member play.","seeing a game on television.","talking about it with her friends."],a:"B",ex:"Her brother plays, but that didn't make her want to play. \"That moment came when there was a professional match on a <b>sports programme</b> I was watching.\" Her friends started <i>after</i> she decided."},
   {n:22,type:"mc",q:"Why does Andrea think that playing against boys is important?",o:["It improves her own playing skills.","It proves there are many girls playing the sport.","It increases respect for female players."],a:"A",ex:"\"I want to do better against boys… which really helps to <b>develop my talents</b>.\" She says there are as many girls as boys, but that is not <i>why</i> it is important."},
   {n:23,type:"mc",q:"How did Andrea feel when she was chosen for the national under-16s team?",o:["surprised to be asked","sorry to leave her club","confident in her abilities"],a:"C",ex:"\"I'd been really happy with how I'd been playing for my club and <b>felt I could do just as well at a higher level</b>.\" She was not surprised — \"I kind of knew it was coming.\""},
   {n:24,type:"mc",q:"Andrea's favourite games are those which are",o:["easy to win.","shown on TV.","exciting to watch."],a:"C",ex:"Not always the TV games. \"If the game's close… then it's <b>fantastic for the crowd to see</b>.\" Winning easily is <i>less</i> interesting for her."},
   {n:25,type:"mc",q:"Andrea says that people who want to start playing ice hockey should",o:["find a club.","buy good equipment.","learn the rules."],a:"A",ex:"Don't just read books, and you can buy your own equipment <i>later</i>. \"<b>Join a team</b> so you can start playing straight away.\" (join a team = find a club)"}
  ]}
];

const L = ["A","B","C"];
let state = {name:"", answers:{}, checked:{}, plays:{}, cur:1};

function norm(s){return (s||"").toLowerCase().replace(/[\u2018\u2019'".,\-\/()!?:;]/g," ").replace(/\s+/g," ").trim().replace(/^(a|an|the) /,"").trim();}
function isRight(q){
  const v = state.answers[q.n];
  if(q.type==="gap"){
    const n=norm(v), ns=n.replace(/ /g,"");
    if(!n) return false;
    return q.acc.some(a=>{const x=norm(a); return x===n || x.replace(/ /g,"")===ns;});
  }
  return v===q.a;
}
function partScore(p){return p.qs.filter(isRight).length;}

function renderTabs(){
  const t=document.getElementById("tabs");
  t.innerHTML = PARTS.map(p=>`<div class="tab ${state.cur===p.id?'on':''} ${state.checked[p.id]?'done':''}" onclick="go(${p.id})">${p.title}<small>${p.sub}</small></div>`).join("")
   + `<div class="tab ${state.cur===5?'on':''}" onclick="go(5)">📊 Results<small>Your score</small></div>`;
}
function go(id){state.cur=id;render();window.scrollTo({top:0,behavior:"smooth"});}

function render(){
  renderTabs();
  const m=document.getElementById("main");
  if(state.cur===5){m.innerHTML=resultsHTML();return;}
  const p=PARTS.find(x=>x.id===state.cur), chk=!!state.checked[p.id];
  let h=`<div class="card part-head"><h2>Listening ${p.title}</h2><b>${p.sub}</b>
    <div class="instr">${p.instr}<span class="ar">${p.ar}</span></div>
    ${p.ctx?`<p class="ctx">${p.ctx}</p>`:""}
    <div class="player"><audio id="aud" controls preload="metadata" src="${p.audio}" onplay="countPlay(${p.id})" onerror="audioMissing()"></audio><span class="plays" id="plays">Plays: ${state.plays[p.id]||0}</span></div>
    <div id="amiss"></div>
    <div class="tip">${p.tip}</div></div><div class="card">`;
  if(p.id===3){
    h+=`<table class="form"><caption>Video game review</caption>`+p.qs.map(q=>{
      const v=state.answers[q.n]||"", cls=chk?(isRight(q)?"right":"wrong"):"";
      return `<tr><td>${q.label}</td><td><span class="qn">${q.n}</span>${q.pre} <input class="gap ${cls}" value="${esc(v)}" ${chk?"disabled":""} oninput="setA(${q.n},this.value)" autocomplete="off"> ${q.post}${fbHTML(q,chk)}</td></tr>`;}).join("")+`</table>`;
  } else {
    h+=p.qs.map(q=>{
      let o="";
      if(q.type==="pic"){
        o=`<img class="pic" src="${IMGS[q.n]}" alt="Pictures A, B and C for question ${q.n}"><div class="opts row">`+L.map(l=>optBtn(q,l,l,chk)).join("")+`</div>`;
      } else {
        o=`<div class="opts">`+q.o.map((t,i)=>optBtn(q,L[i],`<b>${L[i]}</b>${t}`,chk)).join("")+`</div>`;
      }
      return `<div class="q"><div><span class="qn">${q.n}</span>${q.ctx?`<span class="ctx">${q.ctx}</span><br>`:""}<b>${q.q}</b></div>${o}${fbHTML(q,chk)}</div>`;
    }).join("");
  }
  const done=p.qs.filter(q=>state.answers[q.n]).length;
  h+=`<div class="actions">${chk?`<span class="score-pill">Score: ${partScore(p)} / ${p.qs.length}</span><button class="btn ghost" onclick="retry(${p.id})">↺ Try this part again</button>`:`<span style="align-self:center;color:var(--muted)">${done}/${p.qs.length} answered</span><button class="btn" onclick="check(${p.id})">✔ Check my answers</button>`}
   ${p.id<4?`<button class="btn alt" onclick="go(${p.id+1})">Next part →</button>`:`<button class="btn alt" onclick="go(5)">See results →</button>`}</div></div>`;
  m.innerHTML=h;
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");}
function optBtn(q,l,label,chk){
  const sel=state.answers[q.n]===l; let c=sel?"sel":"";
  if(chk){ if(l===q.a) c="right"; else if(sel) c="wrong"; }
  return `<button class="opt ${c}" ${chk?"disabled":""} onclick="pick(${q.n},'${l}')">${label}</button>`;
}
function fbHTML(q,chk){
  if(!chk) return "";
  const ok=isRight(q);
  return `<div class="fb show ${ok?'ok':'no'}">${ok?"✅ Correct!":"❌ The answer is <b>"+q.a+"</b>."}${q.ex?" "+q.ex:""}</div>`;
}
function pick(n,l){state.answers[n]=l;render();}
function setA(n,v){state.answers[n]=v;}
function countPlay(id){state.plays[id]=(state.plays[id]||0)+1;const e=document.getElementById("plays");if(e)e.textContent="Plays: "+state.plays[id];}
function audioMissing(){document.getElementById("amiss").innerHTML=`<div class="missing">⚠️ The audio file for this part could not be loaded. Please ask your teacher.</div>`;}
function check(id){
  const p=PARTS.find(x=>x.id===id), left=p.qs.filter(q=>!state.answers[q.n]).length;
  if(left && !confirm(`You have ${left} unanswered question(s). Check anyway?`)) return;
  state.checked[id]=true; render();
  const s=partScore(p); if(s/p.qs.length>=0.8) confetti();
  toast(`${p.title}: ${s} / ${p.qs.length}`);
}
function retry(id){const p=PARTS.find(x=>x.id===id);p.qs.forEach(q=>delete state.answers[q.n]);delete state.checked[id];render();}

function resultsHTML(){
  let tot=0, rows=PARTS.map(p=>{const s=state.checked[p.id]?partScore(p):null; if(s!==null) tot+=s;
    return `<tr><td><b>${p.title}</b><br><small>${p.sub}</small></td><td>${s===null?'<i style="color:var(--muted)">not checked yet</i>':s+" / "+p.qs.length}</td><td><div class="bar"><i style="width:${s===null?0:s/p.qs.length*100}%"></i></div></td></tr>`;}).join("");
  const all=PARTS.every(p=>state.checked[p.id]), pct=Math.round(tot/25*100);
  let msg = !all?"Check all four parts to get your final score and certificate.":
    pct>=80?"🌟 Excellent! You have earned your certificate.":pct>=60?"👍 Good work! Look at the answers you missed and listen again.":"💪 Keep practising! Listen to each part again and read the feedback.";
  return `<div class="card summary"><h2 style="color:var(--berry);margin-top:0">Your results</h2>
   <div class="big">${tot} / 25</div><p style="text-align:center">${msg}</p>
   <table><tr><th>Part</th><th>Score</th><th></th></tr>${rows}</table>
   <div class="actions">${all&&pct>=80?`<button class="btn" onclick="showCert(${tot})">🏆 My certificate</button>`:""}
   <button class="btn alt" onclick="saveWork()">💾 Save my work</button>
   <button class="btn ghost" onclick="resetAll()">Start again</button></div></div>`;
}
function showCert(t){
  const n=(document.getElementById("sname").value||"").trim();
  if(!n){alert("Please write your name at the top first.");document.getElementById("sname").focus();return;}
  document.getElementById("certName").textContent=n;
  document.getElementById("certScore").textContent=t+" / 25";
  document.getElementById("certDate").textContent=new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
  document.getElementById("main").style.display="none";document.getElementById("tabs").style.display="none";
  document.getElementById("cert").style.display="block";confetti();
}
function hideCert(){document.getElementById("cert").style.display="none";document.getElementById("main").style.display="";document.getElementById("tabs").style.display="";}
function resetAll(){if(!confirm("Delete all your answers and start again?"))return;state={name:state.name,answers:{},checked:{},plays:{},cur:1};render();}

function saveWork(){
  state.name=document.getElementById("sname").value;
  const blob=new Blob([JSON.stringify({app:"PET-Listening-6",saved:new Date().toISOString(),...state},null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=`PET-Listening-6_${(state.name||"student").replace(/\s+/g,"_")}.json`;a.click();toast("Saved ✔");
}
function loadWork(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{try{const d=JSON.parse(r.result); if(d.app!=="PET-Listening-6") throw 0;
    state={name:d.name||"",answers:d.answers||{},checked:d.checked||{},plays:d.plays||{},cur:d.cur||1};
    document.getElementById("sname").value=state.name;render();toast("Work opened ✔");}catch(_){alert("This file is not saved work from this test.");}};
  r.readAsText(f); e.target.value="";
}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",2200);}

function confetti(){
  const c=document.getElementById("confetti"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const col=["#9b1d5a","#4f8a68","#e0a526","#f3a6c8","#9fd1b3"];
  let ps=Array.from({length:160},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,r:4+Math.random()*6,c:col[Math.random()*5|0],vy:2+Math.random()*3,vx:-1.5+Math.random()*3,a:Math.random()*6}));
  let f=0;(function tick(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.a+=.1;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);x.restore();});
   if(++f<220) requestAnimationFrame(tick); else x.clearRect(0,0,c.width,c.height);})();
}
document.getElementById("sname").addEventListener("input",e=>state.name=e.target.value);
render();
</script>
</body>
